name: release

# A tag v<version> publishes the image (ghcr.io/justmytwospence/wellness-lab:<version>, :<major>, :latest)
# and attaches the Python wheels and the wasm engine package to the GitHub release.
# Releases only move forward: cut a new tag instead of re-running an old one.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/justmytwospence/wellness-lab

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: The tag must match the workspace version
        run: |
          version="${GITHUB_REF_NAME#v}"
          crate="$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml)"
          test "$version" = "$crate" || { echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $crate"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  image:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # {{major}} is skipped for 0.x unless enabled; the compose files pull :0
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}},enable=true
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  wheels:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.9.6
          manylinux: "2014"
          target: ${{ matrix.target }}
          args: --release -m crates/py/Cargo.toml -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl

  wasm:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-pack --locked --version 0.13.1
      - run: scripts/build-wasm.sh
      - name: Pack the engine
        run: |
          mkdir -p dist
          tgz="$(cd dist && npm pack ../packages/engine/pkg --silent)"
          want="wellness-lab-wasm-${{ needs.version.outputs.version }}.tgz"
          [ "$tgz" = "$want" ] || mv "dist/$tgz" "dist/$want"
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-package
          path: dist/*.tgz

  release:
    needs: [version, image, wheels, wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{wheel-*,wasm-package}"
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
