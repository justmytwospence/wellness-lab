name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # the browser engine (and the node build the cross-binding check replays)
      - run: cargo install wasm-pack --locked --version 0.13.1
      - run: scripts/build-wasm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          include-hidden-files: true
          path: |
            packages/engine/pkg
            .local/wasm-node
      # the Python wheel, then its tests and the wasm-versus-wheel byte comparison
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.9.6
          manylinux: "2014"
          target: x86_64
          args: --release -m crates/py/Cargo.toml -o dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy polars duckdb pyarrow pytest dist/wellness_lab_engine-*.whl
      - run: python -m pytest -q crates/py/tests
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python tests/xbind/make_cases.py && node tests/xbind/run.mjs

  web:
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wasm
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Playwright against the built app (scripts/e2e.sh serves it with vite preview)
      - run: npx playwright install --with-deps chromium
      - run: scripts/e2e.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            app/test-results
            app/playwright-report

  image:
    # the release image must keep building: build it on every change, without pushing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: wellness-lab:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
