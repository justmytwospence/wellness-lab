[package]
name = "wellness-lab-fit"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "wellness_lab_fit"

[dependencies]
wellness-lab-core = { path = "../core" }
fitparser = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
zip = { version = "9", default-features = false, features = ["deflate"] }
