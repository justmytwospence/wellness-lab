[package]
name = "wellness-lab-py"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "wellness_lab"
crate-type = ["cdylib"]

[dependencies]
wellness-lab-core = { path = "../core" }
wellness-lab-fit = { path = "../fit" }
wellness-lab-io = { path = "../io" }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py311"] }
numpy = "0.30"
serde_json = "1"
